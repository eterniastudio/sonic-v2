<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Production policy, kept identical to installContentSecurityPolicy in
      src/main/index.ts: the packaged renderer loads from file://, where that
      response-header hook does not apply. In development Vite injects its client
      and the React Refresh preamble ahead of this tag; HMR runs on 'self'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: sonic-media:; font-src 'self' data:; connect-src 'self' sonic-media: blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonic V2</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
